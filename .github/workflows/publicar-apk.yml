# Publica una versión: al subir una etiqueta "vX.Y.Z" compila el APK final
# y crea la GitHub Release con el APK adjunto y las notas de CHANGELOG.md.
# Firma: con los secrets SREN_KEYSTORE_BASE64, SREN_KEYSTORE_PASSWORD, SREN_KEY_ALIAS
# y SREN_KEY_PASSWORD (ver docs/COMPILAR.md). Sin ellos usa una clave de prueba.
name: Publicar APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SREN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sren.jks"
            echo "SREN_KEYSTORE_FILE=$RUNNER_TEMP/sren.jks" >> "$GITHUB_ENV"
            echo "FIRMA=Firmado con la clave de Sren." >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave propia: el APK se firma con una clave de prueba."
            echo "FIRMA=Firmado con una clave de prueba: para instalarlo puede que haya que desinstalar la versión anterior." >> "$GITHUB_ENV"
          fi
      - name: Compilar el APK final
        working-directory: sren
        env:
          SREN_KEYSTORE_PASSWORD: ${{ secrets.SREN_KEYSTORE_PASSWORD }}
          SREN_KEY_ALIAS: ${{ secrets.SREN_KEY_ALIAS }}
          SREN_KEY_PASSWORD: ${{ secrets.SREN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cp sren/app/build/outputs/apk/release/app-release.apk "sren-music-$VERSION.apk"
          # Notas: la sección de esta versión en CHANGELOG.md.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notas.md
          printf '\n%s\n' "$FIRMA" >> notas.md
          gh release create "$TAG" "sren-music-$VERSION.apk" --title "Sren music $VERSION" --notes-file notas.md
