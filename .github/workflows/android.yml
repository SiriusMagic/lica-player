# Compila la app y corre sus pruebas en cada PR y en cada cambio a main.
# El APK de prueba queda descargable 30 días en la pestaña "Actions" (sección Artifacts).
name: App Android

on:
  pull_request:
    paths: ["sren/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["sren/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sren
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Pruebas y APK de prueba
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: sren-music-debug
          path: sren/app/build/outputs/apk/debug/*.apk
          retention-days: 30
